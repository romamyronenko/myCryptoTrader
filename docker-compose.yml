name: mycryptotrader

x-common: &common
  image: ${FREQTRADE_IMAGE:-freqtradeorg/freqtrade:stable}
  restart: unless-stopped
  environment:
    PYTHONPATH: /opt/mycryptotrader/src
  volumes:
    - ./config/freqtrade:/freqtrade/config:ro
    - ./src:/opt/mycryptotrader/src:ro
    - ./user_data:/freqtrade/user_data
  healthcheck:
    test:
      - CMD-SHELL
      - python -c "import socket,sys; s=socket.socket(); s.settimeout(2); sys.exit(s.connect_ex(('127.0.0.1', 8080)))"
    interval: 60s
    timeout: 5s
    retries: 3
    start_period: 90s
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  trading:
    <<: *common
    container_name: mycryptotrader-dryrun
    command:
      - trade
      - --config
      - /freqtrade/config/config.dryrun.json
      - --strategy
      - ${STRATEGY:-TaBaseline}
      - --strategy-path
      - /opt/mycryptotrader/src/mycryptotrader/strategies
    ports:
      - "127.0.0.1:${FREQTRADE_DRYRUN_PORT:-18080}:8080"

  trading-live:
    <<: *common
    container_name: mycryptotrader-live
    profiles: ["live"]
    command:
      - trade
      - --config
      - /freqtrade/config/config.live.json
      - --config
      - /freqtrade/config/config.private.json
      - --strategy
      - ${STRATEGY:-TaBaseline}
      - --strategy-path
      - /opt/mycryptotrader/src/mycryptotrader/strategies
    ports:
      - "127.0.0.1:${FREQTRADE_LIVE_PORT:-18081}:8080"
