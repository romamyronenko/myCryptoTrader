name: mycryptotrader

x-common: &common
  image: ${FREQTRADE_IMAGE:-freqtradeorg/freqtrade:stable}
  restart: unless-stopped
  environment:
    PYTHONPATH: /opt/mycryptotrader/src
    BINANCE_API_KEY: ${BINANCE_API_KEY:-}
    BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
    FREQTRADE_API_USERNAME: ${FREQTRADE_API_USERNAME:-freqtrader}
    FREQTRADE_API_PASSWORD: ${FREQTRADE_API_PASSWORD:-change-me}
    FREQTRADE_JWT_SECRET: ${FREQTRADE_JWT_SECRET:-change-me-to-a-long-random-string-32-chars-min}
    TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
    TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  volumes:
    - ./config/freqtrade:/freqtrade/config:ro
    - ./src:/opt/mycryptotrader/src:ro
    - ./user_data:/freqtrade/user_data
  healthcheck:
    test:
      - CMD-SHELL
      - python -c "import socket,sys; s=socket.socket(); s.settimeout(2); sys.exit(s.connect_ex(('127.0.0.1', 8080)))"
    interval: 60s
    timeout: 5s
    retries: 3
    start_period: 90s
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  trading:
    <<: *common
    container_name: mycryptotrader-dryrun
    command:
      - trade
      - --config
      - /freqtrade/config/config.dryrun.json
      - --strategy
      - ${STRATEGY:-TaBaseline}
      - --strategy-path
      - /opt/mycryptotrader/src/mycryptotrader/strategies
    ports:
      - "127.0.0.1:8080:8080"

  trading-live:
    <<: *common
    container_name: mycryptotrader-live
    profiles: ["live"]
    command:
      - trade
      - --config
      - /freqtrade/config/config.live.json
      - --strategy
      - ${STRATEGY:-TaBaseline}
      - --strategy-path
      - /opt/mycryptotrader/src/mycryptotrader/strategies
    ports:
      - "127.0.0.1:8081:8080"
