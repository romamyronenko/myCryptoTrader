[project]
name = "mycryptotrader"
version = "0.1.0"
description = "Research and execution stack for crypto strategies (Binance/Bybit spot)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "myCryptoTrader" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
]

[dependency-groups]
data = [
    "ccxt>=4.4",
    "duckdb>=1.1",
    "pyarrow>=17.0",
]
dev = [
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[project.scripts]
mycryptotrader = "mycryptotrader.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mycryptotrader"]

[tool.uv]
default-groups = ["data", "dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PTH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "mycryptotrader.strategies.*"
ignore_errors = true
